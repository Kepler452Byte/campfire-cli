[project]
name = "campfire-cli"
version = "0.4.1"
description = "Local-first shared context and governance CLI for humans and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "packaging>=24",
  "psutil>=7.2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "typer>=0.29,<0.30",
  "tzdata>=2025.1",
  "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/Kepler452Byte/campfire-cli"
Documentation = "https://github.com/Kepler452Byte/campfire-cli#readme"
Issues = "https://github.com/Kepler452Byte/campfire-cli/issues"
Changelog = "https://github.com/Kepler452Byte/campfire-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
video = ["av>=14,<19", "faster-whisper>=1.1,<2", "huggingface-hub>=0.24,<2", "markdown-it-py>=3"]

[project.scripts]
campfire = "campfire_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["frontend/node_modules/**", "frontend/test-results/**", "frontend/playwright-report/**", "frontend/.e2e-*.json"]

[tool.hatch.build.hooks.custom]
path = "scripts/web_build_hook.py"

[tool.hatch.build.targets.wheel]
packages = ["src/campfire_cli"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "perf: 性能回归测试，只断言确定性计数，不断言墙钟时间",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/campfire_cli/common/documents/*.py" = ["E501"]
"src/campfire_cli/common/archive/*.py" = ["E501"]
"src/campfire_cli/app/workspace/service/restructure_verifier.py" = ["E501"]
"src/campfire_cli/main.py" = ["B008"]
"src/campfire_cli/app/**/cli/*.py" = ["B008"]
"tests/unit/test_common_governance.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
