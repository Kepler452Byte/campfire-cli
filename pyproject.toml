[project]
name = "campfire-cli"
version = "0.1.18"
description = "Local-first shared context and governance CLI for humans and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "psutil>=7.2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.scripts]
campfire = "campfire_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campfire_cli"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "perf: 性能回归测试，只断言确定性计数，不断言墙钟时间",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/campfire_cli/common/documents/*.py" = ["E501"]
"src/campfire_cli/common/archive/*.py" = ["E501"]
"src/campfire_cli/app/workspace/service/restructure_verifier.py" = ["E501"]
"src/campfire_cli/main.py" = ["B008"]
"src/campfire_cli/app/**/cli/*.py" = ["B008"]
"tests/unit/test_common_governance.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
