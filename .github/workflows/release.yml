name: release

on:
  push:
    tags: ["v*"]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Release quality check and build verified distributions
        if: runner.os == 'Linux'
        run: uv run python scripts/quality_check.py --release --artifact-dir dist
      - name: Release quality check
        if: runner.os != 'Linux'
        run: uv run python scripts/quality_check.py --release
      - name: Upload verified distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install published package from PyPI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          verify_dir="$RUNNER_TEMP/campfire-pypi-verify"
          uv venv "$verify_dir"
          uv pip install --python "$verify_dir/bin/python" --index-url https://pypi.org/simple "campfire-cli==$version"
          test "$("$verify_dir/bin/campfire" version)" = "$version"
