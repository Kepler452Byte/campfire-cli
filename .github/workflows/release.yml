name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm exec vitest run && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: src/campfire_cli/resources/web/
          if-no-files-found: error
  native:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      RUN_NATIVE_TEST: "1"
      NATIVE_EVIDENCE_DIR: native-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: src/campfire_cli/resources/web
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --frozen
      - name: Start Linux test user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify native lifecycle and actual timer execution
        run: uv run pytest -q tests/integration/test_job_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}
          path: native-evidence/
  upgrade:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        manager: [uv-tool, pipx]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: src/campfire_cli/resources/web
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --frozen
      - run: uv run --with pipx python scripts/package_upgrade_verify.py --manager ${{ matrix.manager }}
  video:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: src/campfire_cli/resources/web
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --frozen --extra video
      - run: uv run --no-sync python -m pytest tests/unit/test_video.py tests/unit/test_video_runtime.py
  quality:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: src/campfire_cli/resources/web
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Release quality check and build verified distributions
        if: runner.os == 'Linux'
        run: uv run python scripts/quality_check.py --release --artifact-dir dist
      - name: Release quality check
        if: runner.os != 'Linux'
        run: uv run python scripts/quality_check.py --release
      - name: Upload verified distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [web, quality, video, upgrade, native]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install published package from PyPI
        shell: bash
        run: |
          python scripts/pypi_verify.py "${GITHUB_REF_NAME#v}"
