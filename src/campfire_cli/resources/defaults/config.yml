frontmatter_schema:
  version: 3
  resolver:
    fallback: base
    profile_by_type:
      task: task
      board: board
      human-request: human-request
  profiles:
    base:
      unknown_fields: report
      fields:
        name: {kind: string, required: true}
        description: {kind: string, required: true}
        type: {kind: string, required: true}
        document_status: {kind: enum, required: true, default: draft, values: [draft, current, archived]}
        created: {kind: date, required: true}
        updated: {kind: date, required: true}
        tags: {kind: list, required: true, items: string}
    task:
      extends: base
      unknown_fields: report
      fields:
        document_status: {kind: enum, required: true, default: current, values: [draft, current, archived]}
        task_status: {kind: enum, required: true, values: [todo, in-progress, blocked, completed, cancelled]}
        priority: {kind: enum, required: false, values: [urgent, high, medium, low]}
        related_project: {kind: enum, required: false, values_from: workspace.project_ids}
    board:
      extends: base
      unknown_fields: preserve
      fields: {}
    human-request:
      extends: base
      unknown_fields: report
      fields:
        human_decision_status: {kind: enum, required: true, default: pending, values: [pending, decided, deferred, cancelled]}
moc:
  project_groups:
  - label: 任务
    types:
    - task
  - label: 索引
    types:
    - moc
  - label: 产品需求
    types:
    - prd
  - label: 技术设计
    types:
    - trd
  - label: 决策
    types:
    - decision
