frontmatter_schema:
  version: 2
  resolver:
    fallback: base
    profile_by_type:
      knowledge: knowledge
      task: task
    profile_by_governance:
      project-docs: project-doc
  profiles:
    base:
      unknown_fields: preserve
      field_order:
      - name
      - description
      - type
      - status
      - created
      - updated
      - tags
      required:
      - name
      - description
      - type
      - status
      - created
      - updated
      - tags
      optional: []
      enums:
        status:
        - draft
        - current
        - archived
      lists:
      - tags
      dates:
      - created
      - updated
    knowledge:
      extends: base
      field_order:
      - name
      - description
      - type
      - status
      - sources
      - related
      - created
      - updated
      - tags
      required: []
      optional:
      - sources
      - related
      lists:
      - sources
      - related
    project-doc:
      extends: base
      field_order:
      - name
      - description
      - type
      - project
      - domain
      - status
      - lifecycle
      - related
      - superseded_by
      - archive_requested
      - archive_reason
      - archived_at
      - created
      - updated
      - tags
      required:
      - project
      - domain
      - lifecycle
      optional:
      - related
      - superseded_by
      - archive_requested
      - archive_reason
      - archived_at
      enums:
        lifecycle:
        - maintained
        - proposed
        - completed
        - archived
      lists:
      - related
      - superseded_by
      dates:
      - archived_at
    task:
      extends: base
      field_order:
      - name
      - description
      - type
      - task_id
      - project
      - status
      - lifecycle
      - priority
      - assignee
      - task_source
      - requested_by
      - requires_human
      - due
      - completed
      - blocked_reason
      - result_summary
      - verification
      - related
      - created
      - updated
      - tags
      required:
      - task_id
      - project
      - lifecycle
      - task_source
      - assignee
      - requires_human
      optional:
      - priority
      - requested_by
      - due
      - completed
      - blocked_reason
      - result_summary
      - verification
      - related
      enums:
        lifecycle:
        - todo
        - in-progress
        - blocked
        - review
        - completed
        - cancelled
        - archived
        task_source:
        - personal
        - assigned
        priority:
        - urgent
        - high
        - medium
        - low
      lists:
      - assignee
      - verification
      - related
      dates:
      - due
      - completed
      conditional_required:
      - when:
          lifecycle: blocked
        require:
        - blocked_reason
      - when:
          lifecycle: completed
        require:
        - completed
        - result_summary
        - verification
project:
  version: 1
  statuses:
  - active
  - paused
  - archived
  default_space_type: work
archive:
  version: 1
  reasons:
  - superseded
  - completed
  - cancelled
  - obsolete
  - merged
  - project-closed
  reasons_requiring_successor:
  - superseded
  - merged
issues:
  version: 1
  default:
    message: 发现治理规则问题。
    suggestion: 根据 code、path 和 detail 审查后处理。
  warning_codes:
  - untitled-note
  - undeclared-directory
  catalog:
    untitled-note:
    - 文档仍使用临时名称。
    - 理解正文后按文档类型改为有意义的名称；无法判断时保留并请求用户确认。
    project-doc-frontmatter-missing:
    - 项目文档缺少 Frontmatter。
    - 根据正文确定类型和领域，再使用对应项目文档模板补齐元数据。
    frontmatter-missing:
    - 受管文档缺少 Frontmatter。
    - 由 Agent 阅读正文后生成语义治理 Spec，再运行 campfire maintenance plan --id <id> --spec <file>。
    frontmatter-field-order-invalid:
    - Frontmatter 属性顺序不符合当前文档 Profile。
    - 使用 document format，或通过 Maintenance Plan 审批后统一格式化。
    frontmatter-field-missing:
    - Frontmatter 缺少必填字段。
    - 根据 detail 指定的字段补充真实值，不要编造业务信息。
    frontmatter-field-empty:
    - Frontmatter 必填字段存在但值为空。
    - 根据 field 补充真实值；无法确认时保留问题并请求用户确认。
    frontmatter-field-not-allowed:
    - 字段不属于当前文档 Profile。
    - 将叙述信息移入正文，或确认文档类型和领域归属是否正确。
    frontmatter-enum-invalid:
    - Frontmatter 使用了契约之外的枚举值。
    - '使用 issue 的 allowed 值；任务完成语义应写入 lifecycle: completed。'
    task-blocked-reason-missing:
    - 阻塞任务缺少阻塞原因。
    - 填写 blocked_reason，或将 lifecycle 修正为实际状态。
    task-completion-evidence-missing:
    - 完成任务缺少结果或验证证据。
    - 补齐 completed、result_summary 和 verification 后再标记完成。
    document-archive-state-mismatch:
    - 文档状态、生命周期和 archive 路径不一致。
    - 使用两阶段归档流程统一修复，不要只修改其中一个字段。
    template-enum-invalid:
    - Skill 模板中的枚举值与当前 Schema 不一致。
    - 修改项目内 Skill SSOT 后运行 campfire skill sync。
    concurrent-change:
    - 计划生成后有文件被其他会话修改。
    - 重新检查并生成计划；不要覆盖外部会话的最新内容。
    maintenance-config-changed:
    - 生成维护计划后治理配置发生变化。
    - 使用当前 Profile 重新生成 Maintenance Plan。
    maintenance-item-unapproved:
    - 维护计划包含尚未审批的项目。
    - '审查 path 和 detail 后在 Spec 中明确设置 approved: true，再重新生成计划。'
    maintenance-path-outside-scope:
    - 语义治理 Spec 引用了计划范围外的文档。
    - 修正 --scope 或 Spec 中的 path 后重新生成计划。
    maintenance-cross-domain-move:
    - Maintenance Plan 试图跨目录移动文档。
    - 跨 Domain 移动请使用 workspace restructure。
    restructure-source-not-in-inventory:
    - 重构来源不在冻结的批次清单中。
    - 重新执行 inventory 正确范围，或修正计划规格中的 source。
    restructure-config-changed:
    - 生成计划后治理配置发生变化。
    - 重新执行 inventory 和 plan，避免用旧规则执行重构。
    source-hash-changed:
    - 生成重构计划后源文档已被修改。
    - 审查其他会话的变更后重新生成重构计划。
    moc-missing:
    - 领域声明引用的 MOC 文件不存在。
    - 创建声明的 MOC 文件后重新运行 sync；不要让 sync 猜测文件名。
    scope-missing:
    - 指定范围内没有可同步的正式领域。
    - 检查 --scope 路径和领域声明后重试。
    scope-outside-workspace:
    - 指定范围超出当前 Workspace。
    - 使用当前 Workspace 内的相对路径。
    project-doc-current-conflict:
    - 同一物理领域存在多个当前唯一文档。
    - 审查 actual 中的文档，只保留一份 current，或调整其领域和生命周期。
  categories:
    maintenance-:
    - 维护计划不满足执行条件。
    - 修正规格或重新生成 Maintenance Plan 后再执行。
    restructure-:
    - 重构计划不满足执行条件。
    - 修正规格或重新生成重构批次后再执行。
    source-:
    - 重构源文件状态不符合计划。
    - 重新执行 inventory 和 plan，避免覆盖新变化。
    target-:
    - 重构目标路径存在问题。
    - 检查目标路径、重复项和已有文件。
    frontmatter-:
    - Frontmatter 不符合当前契约。
    - 根据字段规则修正后重新检查。
    document-:
    - 文档类型、命名或状态不符合规则。
    - 按文档类型契约修正并重新检查。
    task-:
    - 任务文档缺少必要状态或证据。
    - 补充真实任务信息后重新检查。
    domain-:
    - 领域声明不完整或不一致。
    - 检查 _领域.md 与目录结构。
    archive-:
    - 文档暂不满足归档条件。
    - 补齐归档原因或后继关系后重试。
    inbox-:
    - 全局收件箱配置异常。
    - 检查治理配置与 _收件箱 目录。
skills:
  version: 1
  targets:
  - "~/.claude/skills"
  - "~/.agents/skills"
  managed_skills:
  - campfire-workspace-adoption
  - campfire-workspace-maintenance
  - campfire-workspace-restructure
  - campfire-context-bootstrap
  - campfire-conversation-router
  - campfire-document-capture
  - campfire-inbox-triage
  - campfire-weekly-report-writing
  - campfire-kanban-board
  - campfire-task-management
  unknown_skill_policy: ignore
  orphaned_skill_policy: report
bases:
  version: 1
  target: 治理视图
  managed_bases:
  - 项目文档.base
  - 待归档文档.base
  - 任务工作台.base
  - Agent执行工作台.base
  - 决策工作台.base
  unknown_base_policy: ignore
  orphaned_base_policy: report
