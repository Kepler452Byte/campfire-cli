  inbox: _收件箱
  collaboration_root: _协作
  space_marker: _空间.md
  domain_marker: _领域.md
  related_limit: 3
  related_min_score: 0.08
  cross_domain_related_limit: 2
  cross_domain_min_score: 0.06
  ignored_directories:
  - assets
  - archive
  - generated
  project_reserved_directories:
  - 任务
  - 记录
  - archive
  - _总览
  - _模板
  - a_skill
document_types:
